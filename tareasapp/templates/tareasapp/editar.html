
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar tarea</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1e293b;
            background: linear-gradient(135deg, #dbeafe, #eff6ff, #bfdbfe);
        }

        .navbar {
            padding: 20px 6%;
            background: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.10);
        }

        .navbar h2 {
            color: #1d4ed8;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            margin: 55px auto;
        }

        .panel {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.10);
        }

        h1 {
            color: #1d4ed8;
            margin-bottom: 10px;
        }

        .descripcion-panel {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #eff6ff;
            font-family: inherit;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox input {
            width: 17px;
            height: 17px;
        }

        .checkbox label {
            margin: 0;
        }

        .botones {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button, .boton {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .guardar {
            color: white;
            background: #2563eb;
        }

        .guardar:hover {
            background: #1d4ed8;
        }

        .volver {
            color: #1e40af;
            background: #dbeafe;
        }

        .mensaje {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            color: #1e40af;
            background: #eff6ff;
            line-height: 1.5;
        }

        .mensaje-error {
            color: #991b1b;
            background: #fee2e2;
        }

        .mensaje-exito {
            color: #166534;
            background: #dcfce7;
        }

        @media (max-width: 600px) {
            .contenedor {
                margin: 25px auto;
            }

            .panel {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

    {% csrf_token %}

    <header class="navbar">
        <h2>Gestión de tareas</h2>
    </header>

    <main class="contenedor">

        <section class="panel">

            <h1>Editar tarea</h1>

            <p class="descripcion-panel">
                Modifica la información de la tarea seleccionada.
            </p>

            <p id="mensaje" class="mensaje">
                Cargando información de la tarea...
            </p>

            <form id="formEditar" hidden>

                <div class="campo">

                    <label for="titulo">Título:</label>

                    <input
                        type="text"
                        id="titulo"
                        required
                        maxlength="200"
                        placeholder="Ingresa el título"
                    >

                </div>

                <div class="campo">

                    <label for="descripcion">Descripción:</label>

                    <textarea
                        id="descripcion"
                        required
                        placeholder="Describe la tarea"
                    ></textarea>

                </div>

                <div class="campo checkbox">

                    <input
                        type="checkbox"
                        id="completada"
                    >

                    <label for="completada">
                        Tarea completada
                    </label>

                </div>

                <div class="botones">

                    <button
                        type="submit"
                        class="guardar"
                        id="btnGuardar"
                    >
                        Guardar cambios
                    </button>

                    <a href="/tareas/" class="boton volver">
                        Volver al listado
                    </a>

                </div>

            </form>

        </section>

    </main>

    <script>

        // =========================================
        // CONFIGURACION
        // =========================================

        const partesURL = window.location.pathname
            .split("/")
            .filter(Boolean);

        const tareaId = partesURL[partesURL.length - 1];

        const formulario = document.getElementById("formEditar");

        const campoTitulo = document.getElementById("titulo");
        const campoDescripcion = document.getElementById("descripcion");
        const campoCompletada = document.getElementById("completada");

        const mensaje = document.getElementById("mensaje");
        const botonGuardar = document.getElementById("btnGuardar");

        const csrfToken = document.querySelector(
            '[name=csrfmiddlewaretoken]'
        ).value;


        // =========================================
        // MOSTRAR MENSAJES
        // =========================================

        function mostrarMensaje(texto, tipo) {

            mensaje.textContent = texto;

            mensaje.className = tipo === "error"
                ? "mensaje mensaje-error"
                : tipo === "exito"
                    ? "mensaje mensaje-exito"
                    : "mensaje";

        }


        // =========================================
        // CONSULTAR TAREA - GET
        // API: /api/tareas/<id>/
        // =========================================

        async function cargarTarea() {

            try {

                const respuesta = await fetch(
                    `/api/tareas/${tareaId}/`,
                    {
                        method: "GET",
                        credentials: "same-origin",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                if (respuesta.status === 401) {

                    window.location.replace("/?expired=1");
                    return;

                }

                if (respuesta.status === 403) {

                    throw new Error(
                        "Acceso rechazado. Verifica tu sesión."
                    );

                }

                if (respuesta.status === 404) {

                    throw new Error(
                        "La tarea solicitada no existe."
                    );

                }

                if (!respuesta.ok) {

                    throw new Error(
                        `No se pudo cargar la tarea. HTTP ${respuesta.status}`
                    );

                }

                const tarea = await respuesta.json();

                campoTitulo.value = tarea.titulo;
                campoDescripcion.value = tarea.descripcion;
                campoCompletada.checked = tarea.completada;

                formulario.hidden = false;

                mostrarMensaje(
                    `Editando tarea #${tarea.id}`,
                    "normal"
                );

            } catch (error) {

                console.error("Error al cargar tarea:", error);

                mostrarMensaje(error.message, "error");

            }

        }


        // =========================================
        // ACTUALIZAR TAREA - PUT
        // API: /api/tareas/<id>/
        // =========================================

        formulario.addEventListener("submit", async function(evento) {

            evento.preventDefault();

            const datos = {

                titulo: campoTitulo.value.trim(),

                descripcion: campoDescripcion.value.trim(),

                completada: campoCompletada.checked

            };

            if (!datos.titulo || !datos.descripcion) {

                mostrarMensaje(
                    "El título y la descripción son obligatorios.",
                    "error"
                );

                return;

            }

            botonGuardar.disabled = true;
            botonGuardar.textContent = "Guardando cambios...";

            mostrarMensaje("Actualizando tarea...", "normal");

            try {

                const respuesta = await fetch(
                    `/api/tareas/${tareaId}/`,
                    {
                        method: "PUT",

                        credentials: "same-origin",

                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json",
                            "X-CSRFToken": csrfToken
                        },

                        body: JSON.stringify(datos)
                    }
                );

                if (respuesta.status === 401) {

                    window.location.replace("/?expired=1");
                    return;

                }

                if (respuesta.status === 403) {

                    throw new Error(
                        "Acceso rechazado. Verifica tu sesión y el token CSRF."
                    );

                }

                const resultado = await respuesta.json();

                if (!respuesta.ok) {

                    throw new Error(
                        resultado.error ||
                        resultado.mensaje ||
                        `Error HTTP ${respuesta.status}`
                    );

                }

                mostrarMensaje(
                    "Tarea actualizada correctamente.",
                    "exito"
                );

                setTimeout(function() {

                    window.location.href = "/tareas/";

                }, 1200);

            } catch (error) {

                console.error("Error al actualizar:", error);

                mostrarMensaje(error.message, "error");

                botonGuardar.disabled = false;
                botonGuardar.textContent = "Guardar cambios";

            }

        });


        // =========================================
        // CARGA INICIAL
        // =========================================

        cargarTarea();

    </script>

</body>
</html>
