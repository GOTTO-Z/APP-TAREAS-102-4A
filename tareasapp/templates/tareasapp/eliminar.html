<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Eliminar tarea</title>
</head>

<body>

    <h1>🗑️ Eliminar tarea</h1>

    <p>
        ¿Estás seguro de que quieres eliminar esta tarea?
    </p>

    <h2>{{ tarea.titulo }}</h2>

    <p>
        {{ tarea.descripcion }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

    </form>

    <br>

    <a href="/">
        ← Cancelar y volver al inicio
    </a>

</body>

</html>
