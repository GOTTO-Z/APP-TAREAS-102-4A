<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Detalle de tarea</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 60%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        .informacion {
            margin-top: 30px;
        }

        .informacion p {
            font-size: 18px;
        }

        .boton {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>

</head>

<body>

<div class="contenedor">

    <h1>👁️ Detalle de tarea</h1>

    <div class="informacion">

        <p>
            <strong>ID:</strong>
            {{ tarea.id }}
        </p>

        <p>
            <strong>Título:</strong>
            {{ tarea.titulo }}
        </p>

        <p>
            <strong>Descripción:</strong>
            {{ tarea.descripcion }}
        </p>

        <p>
            <strong>Estado:</strong>

            {% if tarea.completada %}
                Completada ✅
            {% else %}
                Pendiente ⏳
            {% endif %}

        </p>

    </div>

    <a href="/" class="boton">
        ← Volver al inicio
    </a>

</div>

</body>

</html>
